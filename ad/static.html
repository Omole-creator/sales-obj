<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Static ad creatives (rendered to PNG)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --brand:#FF4500; --gold:#F5B301; --ink:#0a0a0a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#222; display:flex; flex-direction:column; align-items:center; gap:28px; padding:28px; font-family:"Plus Jakarta Sans",sans-serif; }

  .slide { width:1080px; height:1080px; position:relative; overflow:hidden; background:var(--ink); color:#fff; }
  .slide::after{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.05;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .glow{ position:absolute; border-radius:50%; background:rgba(255,69,0,.28); filter:blur(130px); }
  .tape{ position:absolute; left:0; right:0; height:16px; z-index:3;
    background-image:repeating-linear-gradient(-45deg,var(--brand) 0,var(--brand) 24px,var(--ink) 24px,var(--ink) 48px); }

  .eyebrow{ font-size:28px; font-weight:800; letter-spacing:6px; text-transform:uppercase; color:var(--brand); }
  h1{ font-family:"Anton",sans-serif; text-transform:uppercase; line-height:1.0; letter-spacing:-.5px; }
  .hl{ color:var(--brand); }
  .sub{ font-size:40px; font-weight:700; line-height:1.3; color:#cfcfcf; }
  .chip{ display:inline-flex; align-items:center; gap:12px; background:var(--brand); color:#000;
         font-family:"Anton",sans-serif; text-transform:uppercase; font-size:34px; padding:16px 30px; border-radius:14px; }

  /* ---------- CREATIVE 1 ---------- */
  #c1 .glow{ width:640px; height:640px; top:50%; right:-170px; transform:translateY(-50%); }
  #c1 .copy{ position:absolute; top:0; bottom:0; left:70px; width:440px; z-index:2;
             display:flex; flex-direction:column; justify-content:center; }
  #c1 h1{ font-size:70px; line-height:1.02; margin-top:22px; }
  #c1 .sub{ margin-top:22px; width:420px; }
  #c1 .chip{ margin-top:32px; align-self:flex-start; font-size:30px; }
  #c1 .book{ position:absolute; right:25px; top:50%; transform:translateY(-50%); height:760px; z-index:1;
             filter:drop-shadow(0 30px 60px rgba(0,0,0,.7)); }

  /* ---------- CREATIVE 2 ---------- */
  #c2 .glow{ width:640px; height:640px; bottom:-180px; left:50%; transform:translateX(-50%); }
  #c2 .copy{ position:absolute; top:96px; left:0; right:0; text-align:center; z-index:2; padding:0 70px; }
  #c2 h1{ font-size:92px; margin-top:20px; }
  #c2 .sub{ margin-top:24px; font-size:38px; max-width:820px; margin-left:auto; margin-right:auto; }
  #c2 .stage2{ position:absolute; bottom:70px; left:0; right:0; height:560px; z-index:2;
               display:flex; align-items:flex-end; justify-content:center; gap:0; }
  #c2 .main{ height:540px; filter:drop-shadow(0 26px 50px rgba(0,0,0,.7)); position:relative; z-index:2; margin-right:-40px; }
  #c2 .bonus{ height:330px; border-radius:14px; border:3px solid #ffffff20; filter:drop-shadow(0 20px 40px rgba(0,0,0,.6)); margin-bottom:30px; }
  #c2 .badge{ position:absolute; right:95px; top:470px; z-index:5; background:var(--gold); color:#000;
              font-family:"Anton",sans-serif; text-transform:uppercase; font-size:34px; padding:16px 26px;
              border-radius:14px; transform:rotate(6deg); box-shadow:0 14px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>

<!-- ===== CREATIVE 1: main ebook · pain + curiosity ===== -->
<div class="slide" id="c1">
  <div class="tape" style="top:0;"></div>
  <div class="glow"></div>
  <div class="copy">
    <div class="eyebrow">For Nigerian sellers</div>
    <h1>They Went <span class="hl">Silent</span> After You Sent The Price.</h1>
    <div class="sub">Here&rsquo;s exactly what to say next.</div>
    <div class="chip">See what&rsquo;s inside &darr;</div>
  </div>
  <img class="book" src="../public/mainbook.png" alt="ebook" />
</div>

<!-- ===== CREATIVE 2: ebook + 3 bonuses · value ===== -->
<div class="slide" id="c2">
  <div class="tape" style="top:0;"></div>
  <div class="glow"></div>
  <div class="copy">
    <div class="eyebrow">The complete toolkit</div>
    <h1>Everything You Need<br>To <span class="hl">Close The Sale.</span></h1>
    <div class="sub">The main guide plus 3 free bonuses, built for how Nigerians sell on WhatsApp &amp; IG.</div>
  </div>
  <div class="badge">+ 3 Bonuses Free</div>
  <div class="stage2">
    <img class="main" src="../public/mainbook.png" alt="main ebook" />
    <img class="bonus" src="../public/3book.jpg" alt="3 bonuses" />
  </div>
</div>

</body>
</html>
